[package]
name = "flag-kit"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/flag-kit"
description = "Feature flags with rollout, targeting, and audit — deterministic percentage rollout, org targeting, and change history"
keywords = ["feature-flag", "rollout", "experiment", "targeting"]
categories = ["config"]
exclude = ["/target"]
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2", default-features = false }
tokio = { version = "1", features = ["rt", "sync", "macros"] }
dashmap = "6"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"], optional = true }
tracing = { version = "0.1", optional = true }
# Flag-name validation is delegated to validkit::FlagName (single source
# of truth for the `^[a-z][a-z0-9_]*$` rule across the workspace).
validkit = "1.3.1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full"] }
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

[features]
default = ["std"]
std = ["thiserror/std"]
chrono = ["dep:chrono"]
# Regex-backed validation inside validkit (flag-kit no longer carries its
# own regex engine; this forwards to `validkit/regex`).
regex = ["validkit/regex"]
sqlite = ["dep:rusqlite"]
tracing = ["dep:tracing"]
uuid = []

[[bench]]
name = "flag_bench"
harness = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
